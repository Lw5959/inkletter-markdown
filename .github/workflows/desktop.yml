name: 桌面打包

on:
  push:
    branches: [integration, main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            target: universal-apple-darwin
            name: macos-universal
          - os: windows-2025
            bundle: nsis
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-24.04
            bundle: deb,appimage
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            bundle: deb
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf cmake
      - name: 安装 Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "${{ matrix.target }}" == "universal-apple-darwin" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundle }}"
      - uses: actions/upload-artifact@v4
        with:
          name: yeyu-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*-setup.exe
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.AppImage
