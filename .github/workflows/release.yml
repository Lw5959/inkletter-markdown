name: 发布页屿

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的版本标签，例如 v0.2.5
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64, bundles: 'app,dmg' }
          - { os: macos-15, target: x86_64-apple-darwin, platform: macos-x64, bundles: 'app,dmg' }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, platform: windows-x64, bundles: nsis }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64, bundles: 'deb,appimage' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, bundles: 'deb,appimage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf cmake
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: 构建安装包和签名更新包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          pnpm tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
          node scripts/stage-desktop-release.mjs 'src-tauri/target/${{ matrix.target }}/release/bundle' '${{ matrix.platform }}' release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: 安装 Android 工具链
        run: |
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android build --ci --apk --target aarch64
      - name: 签名并核对 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/yeyu-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          version=$(node -p 'require("./package.json").version')
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)
          test -f "$unsigned"
          mkdir -p release-assets
          package="release-assets/Yeyu_${version}_android-arm64.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$keystore" --ks-key-alias yeyu --ks-pass env:ANDROID_KEY_PASSWORD --out "$package" "$unsigned"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          if-no-files-found: error
          path: release-assets/

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: 生成清单并发布完整版本
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-manifest.mjs release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --generate-notes --title "页屿 $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
