[package]
name = "yeyu"
version = "0.2.5"
edition = "2024"
description = "A Markdown editor for desktop and Android"
license = "MIT"
repository = "https://github.com/Lw5959/yeyu"

[lib]
name = "yeyu_android"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
blake3 = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
dunce = "1"
walkdir = "2"
glob = "0.3"
trash = "5"
regex = "1"
base64 = "0.22"
mime_guess = "2"
plist = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "fs", "macros"] }
futures-util = "0.3"
eventsource-stream = "0.2"
keyring = "4.2"
rmcp = { version = "3.11", features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tungstenite = "0.29"
url = "2"
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate"] }
rquickjs = "0.14"
semver = "1"
sha2 = "0.10"
tauri-plugin-updater = "2.13"

[features]
qa = []

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSGraphics", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSGeometry", "NSRange", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
