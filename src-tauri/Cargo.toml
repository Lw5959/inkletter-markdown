[package]
name = "yeyu"
version = "0.1.0"
edition = "2024"
description = "A desktop Markdown editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
blake3 = "1"
