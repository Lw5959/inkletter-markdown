[package]
name = "yeyu"
version = "0.2.2"
edition = "2024"
description = "A desktop Markdown editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
blake3 = "1"
dunce = "1"
walkdir = "2"
glob = "0.3"
trash = "5"
regex = "1"
base64 = "0.22"
mime_guess = "2"
plist = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "fs", "macros"] }
futures-util = "0.3"
eventsource-stream = "0.2"
keyring = "4.2"
rmcp = { version = "3.11", features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tungstenite = "0.29"
url = "2"
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate"] }
rquickjs = "0.14"
semver = "1"
sha2 = "0.10"

[features]
qa = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSRange", "NSString"] }
